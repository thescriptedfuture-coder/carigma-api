[project]
name = "carigma-api"
version = "0.1.0"
description = "Carigma V2 API — FastAPI service wrapping the Carigma career-intelligence engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    # Payments are BUILT but dormant (P5). The SDK ships now so the path is
    # real code rather than a sketch to be written under time pressure later.
    "razorpay>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ── Lint + format (ruff replaces black+isort+flake8) ────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "S",    # bandit (security) — this service guards career data
    "ASYNC",
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the point of a test file; hardcoded test tokens are not secrets.
"tests/**" = ["S101", "S105", "S106"]

# ── Types ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# The Razorpay SDK ships no type stubs. Scoped to that one module so nothing
# else silently loses type checking.
[[tool.mypy.overrides]]
module = ["razorpay.*"]
ignore_missing_imports = true

# ── Tests ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
